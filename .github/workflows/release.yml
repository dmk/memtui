name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: memtui
            asset_name: memtui-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: memtui
            asset_name: memtui-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: memtui
            asset_name: memtui-macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create tarball
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.tar.gz
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.tar.gz.sha256

  create-release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    outputs:
      sha256_linux_x86_64: ${{ steps.checksums.outputs.sha256_linux_x86_64 }}
      sha256_macos_x86_64: ${{ steps.checksums.outputs.sha256_macos_x86_64 }}
      sha256_macos_arm64: ${{ steps.checksums.outputs.sha256_macos_arm64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Display structure of downloaded files
        run: ls -R

      - name: Extract checksums
        id: checksums
        run: |
          echo "sha256_linux_x86_64=$(cat memtui-linux-x86_64/memtui-linux-x86_64.tar.gz.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha256_macos_x86_64=$(cat memtui-macos-x86_64/memtui-macos-x86_64.tar.gz.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha256_macos_arm64=$(cat memtui-macos-arm64/memtui-macos-arm64.tar.gz.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            memtui-linux-x86_64/memtui-linux-x86_64.tar.gz
            memtui-macos-x86_64/memtui-macos-x86_64.tar.gz
            memtui-macos-arm64/memtui-macos-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: dmk/homebrew-memtui
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          cd homebrew-tap
          cat > Formula/memtui.rb << 'EOF'
          class Memtui < Formula
            desc "Interactive TUI for browsing and inspecting key-value stores (Redis, Memcached, etc.)"
            homepage "https://github.com/dmk/memtui"
            version "${{ steps.version.outputs.version }}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/dmk/memtui/releases/download/v#{version}/memtui-macos-arm64.tar.gz"
                sha256 "${{ needs.create-release.outputs.sha256_macos_arm64 }}"
              else
                url "https://github.com/dmk/memtui/releases/download/v#{version}/memtui-macos-x86_64.tar.gz"
                sha256 "${{ needs.create-release.outputs.sha256_macos_x86_64 }}"
              end
            end

            on_linux do
              url "https://github.com/dmk/memtui/releases/download/v#{version}/memtui-linux-x86_64.tar.gz"
              sha256 "${{ needs.create-release.outputs.sha256_linux_x86_64 }}"
            end

            def install
              bin.install "memtui"
            end

            test do
              system "#{bin}/memtui", "--version"
            end
          end
          EOF

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/memtui.rb
          git commit -m "Update memtui to ${{ steps.version.outputs.version }}"
          git push
