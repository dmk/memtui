[package]
name = "memtui"
version = "0.4.1"
edition = "2021"
authors = ["Dmytro Koval <contact@dkoval.pro>"]
description = "An interactive TUI (Terminal User Interface) for browsing and inspecting key-value stores (Redis, Memcached, etc.)"
license = "Apache-2.0"
repository = "https://github.com/dmk/memtui"
homepage = "https://github.com/dmk/memtui"
keywords = ["tui", "redis", "memcached", "key-value", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tui-dispatch = { version = "0.2.2" }
ratatui = "0.29"
crossterm = "0.28"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
memcache = "0.17"
openssl-sys = { version = "0.9", features = ["vendored"] }
etcd-client = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
unicode-width = "0.1"
toml = "0.8"
nucleo-matcher = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
base64 = "0.22"

[dev-dependencies]
rstest = "0.22"
insta = { version = "1.39", features = ["glob"] }
tokio = { version = "1", features = ["test-util"] }
