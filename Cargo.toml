[package]
name = "memtui"
version = "0.1.2"
edition = "2021"
authors = ["Dmytro Koval <contact@dkoval.pro>"]
description = "An interactive TUI (Terminal User Interface) for browsing and inspecting key-value stores (Redis, Memcached, etc.)"
license = "Apache-2.0"
repository = "https://github.com/dmk/memtui"
homepage = "https://github.com/dmk/memtui"
keywords = ["tui", "redis", "memcached", "key-value", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.28"
crossterm = "0.27"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
memcache = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
tui-input = "0.8"
unicode-width = "0.1"
toml = "0.8"
