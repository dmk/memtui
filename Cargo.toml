[package]
name = "memtui"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
memcache = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Integration tests require a running Redis instance
integration-tests = []
