version: "3.9"

services:
  redis:
    image: redis:8.2.3
    container_name: memtui_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --save
      - "60"
      - "1000"
      - --loglevel
      - warning

  memcached:
    image: memcached:1.6
    container_name: memtui_memcached
    restart: unless-stopped
    ports:
      - "11211:11211"
    command:
      - memcached
      - -m
      - "128"
      - -I
      - 2m

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: memtui_etcd
    restart: unless-stopped
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd_data:/etcd-data
    environment:
      - ETCD_NAME=memtui-etcd
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://localhost:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=memtui-etcd=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=memtui-cluster
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_LOG_LEVEL=warn

volumes:
  redis_data:
  etcd_data:
